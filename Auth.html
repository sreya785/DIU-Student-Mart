<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — DIU Student Mart</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
 
  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-logo" onclick="window.location.href='index.html'">
      <div class="logo-box">SM</div>
      DIU Student Mart
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="listings.html">Browse</a>
    </div>
  </nav>
 
  <!-- AUTH SECTION -->
  <section class="container" style="max-width:420px;margin-top:40px">
 
    <!-- LOGIN CARD -->
    <div class="auth-card" id="login-card">
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-sub">Sign in to your DIU Student Mart account</p>
      <div class="alert alert-error" id="login-error" style="display:none"></div>
      <div class="alert alert-success" id="login-success" style="display:none"></div>
      <div class="form-group">
        <label>Student ID or Email</label>
        <input type="text" id="login-email" placeholder="e.g. 211-15-1234 or email@diu.edu.bd">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter your password">
      </div>
      <button class="btn-full" onclick="doLogin()">Sign In</button>
      <p class="auth-switch">Don't have an account? <span onclick="toggleForm('register')">Register here</span></p>
      <p class="demo-hint">Demo: admin@diu.edu.bd / admin123</p>
    </div>
 
    <!-- REGISTER CARD -->
    <div class="auth-card" id="register-card" style="display:none">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Join DIU Student Mart today</p>
      <div class="alert alert-error" id="reg-error" style="display:none"></div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Student ID</label>
        <input type="text" id="reg-id" placeholder="e.g. 211-15-1234">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="yourid@diu.edu.bd">
      </div>
      <div class="form-group">
        <label>Department</label>
        <select id="reg-dept">
          <option>CSE</option>
          <option>EEE</option>
          <option>BBA</option>
          <option>CE</option>
          <option>Textile</option>
          <option>Law</option>
          <option>English</option>
          <option>Pharmacy</option>
        </select>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" id="reg-phone" placeholder="01XXXXXXXXX">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Minimum 6 characters">
      </div>
      <button class="btn-full" onclick="doRegister()">Create Account</button>
      <p class="auth-switch">Already have an account? <span onclick="toggleForm('login')">Sign in</span></p>
    </div>
 
  </section>
